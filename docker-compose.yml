services:
  postgres:
    image: postgres:16
    container_name: sentellent-postgres
    environment:
      POSTGRES_DB: sentellent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentellent-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentellent-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg2://postgres:Postgres123@host.docker.internal:5432/sentellent
    restart: unless-stopped
    networks:
      - sentellent-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentellent-frontend
    ports:
      - "3000:3000"
    env_file:
      - frontend/.env
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    restart: unless-stopped
    networks:
      - sentellent-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  sentellent-network:
    driver: bridge
